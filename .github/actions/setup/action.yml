name: Set up the workspace
description: Installs pnpm, Node.js and the dependencies, then builds the packages core depends on.

inputs:
  build:
    description: Whether to build; the build step's outcome is the output `build`.
    default: 'true'

outputs:
  build:
    description: success, failure or skipped
    value: ${{ steps.build.outcome }}

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # docs/README.md, Test levels
    - name: Build
      id: build
      if: inputs.build == 'true'
      continue-on-error: true
      shell: bash
      run: pnpm -r --no-bail --filter '!@genoacms/core' run build && pnpm --filter @genoacms/core run check:config
