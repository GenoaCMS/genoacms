name: Set up the workspace
description: Installs pnpm, Node.js and the dependencies, then builds the packages core depends on.

inputs:
  build:
    description: Whether to build; the build step's outcome is the output `build`.
    default: 'true'

outputs:
  build:
    description: success, failure or skipped
    value: ${{ steps.build.outcome }}

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # docs/README.md, Test levels
    - name: Build
      id: build
      if: inputs.build == 'true'
      continue-on-error: true
      shell: bash
      run: pnpm -r --no-bail --filter '!@genoacms/core' run build && pnpm --filter @genoacms/core run check:config
