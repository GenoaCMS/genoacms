name: CI

# WORKFLOW §11.1
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.setup.outputs.build }}
    steps:
      # WORKFLOW §8.3
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check documentation
        run: node docs/tools/check-docs.mjs docs

      - name: Set up the workspace
        id: setup
        uses: ./.github/actions/setup

      - name: Fail when the build failed
        if: steps.setup.outputs.build != 'success'
        run: exit 1

      # CF33
      - name: Contracts type checks
        run: pnpm --filter @genoacms/contracts run check

  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # WORKFLOW §8.3
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # core's component tests run in Vitest browser mode
      - name: Install Chromium for Playwright
        run: pnpm --filter @genoacms/core exec playwright install --with-deps chromium

      - name: Unit tests
        run: node scripts/test-level.mjs unit

      - name: Upload the unit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-unit
          path: reports/
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54 # 16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # WORKFLOW §8.3
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Integration tests
        run: node scripts/test-level.mjs integration

      # adapter-minio.md MF2, MS1
      - name: Start RustFS
        if: ${{ !cancelled() }}
        run: >-
          docker run -d --name rustfs -p 127.0.0.1:9100:9000
          -e RUSTFS_ACCESS_KEY=conformance -e RUSTFS_SECRET_KEY=conformance-secret
          docker.io/rustfs/rustfs@sha256:128220dc9382bac81940a1a9616ee8c274a3f3b8f647eedbeb50df5bb8b49922 /data

      - name: Conformance tests
        if: ${{ !cancelled() }}
        run: node scripts/test-level.mjs conformance
        env:
          GENOACMS_TEST_MINIO: '1'
          GENOACMS_TEST_MINIO_BUCKET: genoacms-conformance
          MINIO_ENDPOINT: 127.0.0.1
          MINIO_PORT: '9100'
          MINIO_USE_SSL: 'false'
          MINIO_ACCESS_KEY: conformance
          MINIO_SECRET_KEY: conformance-secret
          GENOACMS_TEST_POSTGRES: '1'
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Upload the integration reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-integration
          path: reports/
          if-no-files-found: warn

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # WORKFLOW §8.3
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # core's component tests run in Vitest browser mode
      - name: Install Chromium for Playwright
        run: pnpm --filter @genoacms/core exec playwright install --with-deps chromium

      # WORKFLOW §6.2, §11.1; docs/README.md, Test levels
      - name: Authenticate to Google Cloud
        id: gcp
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TEST_SERVICE_ACCOUNT }}

      - name: End-to-end tests
        id: e2e
        run: node scripts/test-level.mjs e2e
        env:
          GENOACMS_TEST_GCP: ${{ steps.gcp.outcome == 'success' && '1' || '' }}
          GENOACMS_TEST_GCP_PROJECT: ${{ vars.GCP_TEST_PROJECT }}
          GENOACMS_TEST_GCP_BUCKET: ${{ vars.GCP_CORE_E2E_BUCKET }}

      - name: Upload the e2e reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-e2e
          path: reports/
          if-no-files-found: warn

  contract:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # WORKFLOW §8.3
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up the workspace
        uses: ./.github/actions/setup

      - name: Authenticate to Google Cloud
        id: gcp
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TEST_SERVICE_ACCOUNT }}

      - name: Authenticate to AWS
        if: vars.AWS_TEST_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_TEST_ROLE_ARN }}
          aws-region: ${{ vars.AWS_TEST_REGION }}

      - name: Contract tests
        id: contract
        run: node scripts/test-level.mjs contract
        env:
          GENOACMS_TEST_GCP: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && '1' || '' }}
          GENOACMS_TEST_GCP_IDENTITY: '1'
          GENOACMS_TEST_GCP_PROJECT: ${{ vars.GCP_TEST_PROJECT }}
          GENOACMS_TEST_GCP_BUCKET: ${{ vars.GCP_TEST_BUCKET }}
          GENOACMS_TEST_GCP_REGION: ${{ vars.GCP_TEST_REGION }}
          GENOACMS_TEST_AWS: ${{ vars.AWS_TEST_ROLE_ARN != '' && '1' || '' }}
          GENOACMS_TEST_AWS_REGION: ${{ vars.AWS_TEST_REGION }}
          GENOACMS_TEST_AWS_BUCKET: ${{ vars.AWS_TEST_BUCKET }}
          GENOACMS_TEST_AWS_LAMBDA_ROLE: ${{ vars.AWS_TEST_LAMBDA_ROLE }}

      - name: Upload the contract reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports-contract
          path: reports/
          if-no-files-found: warn

  verify:
    needs: [build, unit, integration, e2e, contract]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # WORKFLOW §8.3
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Download the reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: reports-*
          path: reports/
          merge-multiple: true

      - name: Record verification
        run: |
          args=()
          for report in reports/*/*.xml; do
            args+=(--junit "$(basename "$(dirname "$report")")=$report")
          done
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            args+=(--defer contract)
          fi
          node docs/tools/record.mjs docs "${args[@]}" --build "$BUILD"
        env:
          BUILD: ${{ needs.build.outputs.build == 'success' && 'passed' || 'failed' }}

      - name: Upload verification record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification
          path: |
            verification.json
            reports/
          if-no-files-found: warn

      - name: Fail when a job failed, also outside its JUnit report
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  release:
    needs: verify
    if: github.event_name == 'push'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      pull-requests: write
      id-token: write
