name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Equivalent of the `npm ci` that every per-repo workflow ran before the
      # monorepo: proves the lockfile is complete and consistent with every
      # package.json. That is deliberately all this does.
      #
      # Workspace-wide lint / type-check / build are NOT run here. None of them
      # ever ran in CI as separate repos, and they cannot pass today:
      #   - core's eslint reports 188 pre-existing errors, svelte-check 251
      #   - sveltekit-adapter's tsc reports 2 pre-existing errors
      #   - core's `vite build` authenticates against GCP at build time and so
      #     requires a real genoa.config/gcp/serviceAccount.json, which is
      #     gitignored and cannot exist in CI
      # Reintroduce them per package once that debt is paid, e.g.
      #   pnpm --filter @genoacms/adapter-gcp run build
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
