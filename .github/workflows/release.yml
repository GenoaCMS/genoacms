name: Release

# WORKFLOW §11.4
on:
  workflow_call:

permissions: {}

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Download verification record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification

      - name: Require a releasable record of this commit
        run: |
          node -e '
            const record = JSON.parse(require("node:fs").readFileSync("verification.json", "utf-8"))
            if (record.commit !== process.env.GITHUB_SHA) throw new Error(`verification.json is of ${record.commit}, not ${process.env.GITHUB_SHA}`)
            if (record.releasable !== true) throw new Error("verification.json is not releasable")
          '
          mkdir -p "$RUNNER_TEMP/verification"
          mv verification.json "$RUNNER_TEMP/verification/"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm to 11.5.1 or later, the first with OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Attach the verification record to each release
        if: steps.changesets.outputs.published == 'true'
        run: |
          node -e '
            for (const { name, version } of JSON.parse(process.env.PUBLISHED)) console.log(`${name}@${version}`)
          ' | while read -r tag; do
            gh release upload "$tag" "$RUNNER_TEMP/verification/verification.json"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
