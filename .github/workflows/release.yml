name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      # changesets shells out to `npm publish`, and OIDC trusted publishing needs
      # npm >= 11.5.1. Node 22 bundles npm 10.9.x, which has no OIDC support at
      # all — it goes straight to token auth and fails with ENEEDAUTH.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Opens (or updates) a "Version Packages" PR while changesets are pending.
      # Merging that PR runs this workflow again, this time publishing.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN: publishing goes through OIDC trusted publishing,
          # configured per package on npmjs.com. setup-node writes an .npmrc line
          # of `_authToken=${NODE_AUTH_TOKEN}`, so passing an unset secret leaves
          # an empty token there for npm to trip over. To go back to token auth,
          # add the secret and restore this line.
          NPM_CONFIG_PROVENANCE: true
